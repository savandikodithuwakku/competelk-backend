# Application identity
spring.application.name=competelk-backend

# Database connection: values supplied by the deployment environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/competelk}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Development-only schema management.
# Replace with Flyway migrations before production deployment.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Disable SQL logging by default.
spring.jpa.show-sql=false

# Server port provided by the hosting platform, if available.
server.port=${PORT:8080}

# Do not keep database sessions open during web response rendering.
spring.jpa.open-in-view=false